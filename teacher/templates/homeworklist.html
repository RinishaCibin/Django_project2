<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />

          <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </head>

    <body>
        <header class="bg-info p-3">
            <h2 class="text-white">Home Works</h2>
        </header>

        <div style="min-height: 80vh; padding: 5px;">

        <a href="{% url 'addhw'%}" class="btn btn-primary my-5">Add Homework +</a>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Subject</th>
                    <th>Question</th>
                    <th>Date of Submission</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {% for i in data %}
                <tr>
                    <td>{{i.id}}</td>
                    <td>{{i.subject}}</td>
                    <td>{{i.question}}</td>
                    <td>{{i.submit_date}}</td>
                    <td>
                        <a href="{% url 'edithw' i.id %}" class="btn btn-warning me-2">Edit</a>
                        <a href="{% url 'deletehw' i.id %}" class="btn btn-danger">Delete</a>

                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table> 
        </div>


        <footer class="bg-info p-4">
            <h3 class="text-center">Homeworks @ 2026 </h3>

        </footer>
      
    </body>
</html>
