<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
         <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </head>

    <body>

        <header class="bg-info p-3">
            <h2 class="text-white">Home Works</h2>
        </header>

        <div class="d-flex justify-content-center align-item-center" style="min-height: 80vh; padding: 5px;">
            <div class="w-50 border shadow p-2 bg-light">
                <h2 class="text-center">Add Homework</h2>
                <form action="" method="post">
                    {% csrf_token %}
                    <table class="table">
                        {{form.as_table}}
             
                    </table>
               
                    <button class="btn btn-success">Submit</button>
                </form>
            </div> 
        </div>



        <footer class="bg-info p-4">
            <h3 class="text-center">Homeworks @ 2026 </h3>
        </footer>
        
    </body>
</html>
