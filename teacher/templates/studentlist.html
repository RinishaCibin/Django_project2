<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
          <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </head>

    <body>
        <header class="bg-info text-light text-center p-1">
            <h2>StudentMng</h2>
        </header>


       <h1>Student List</h1>
       <a href="{% url 'sadd'%}" class="btn btn-success m-5">Add new Student +</a>
       <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>name</th>
                <th>Age</th>
                <th>batch</th>
                <th>place</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for i in data %}
            <tr>
                <td>{{i.id}}</td>
                <td>{{i.name}}</td>
                <td>{{i.age}}</td>
                <td>{{i.batch}}</td>
                <td>{{i.place}}</td>
                <td>
                    <a href="{% url 'sedit' i.id %}"class="btn btn-warning me-2">Edit</a>
                    <a href="{% url 'stdelete' i.id %}"class="btn btn-danger">Delete</a><br>
                </td>
            </tr>
            {% endfor %}
        </tbody>
       </table>

       <footer class="bg-info text-light text-center p-2 fixed-bottom">
        <h6>Student management app @ 2026</h6>

       </footer>

    </body>
</html>
