<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
             <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </head>

    <body>
        
        <header class="bg-info text-light text-center p-1">
            <h2>Edit Student</h2>
        </header>

        <h1>Add student details: </h1>
        <div class="p-5">
            <form action="" method="post">
                {%csrf_token%}
            <input type="text" name="name" value="{{student.name}}" placeholder="Enter name" class="form-control mb-3"><br>
            <input type="text" age="age" value="{{student.age}}" placeholder="Enter age"  class="form-control mb-3"><br>
            <input type="text" batch="batch" value="{{student.batch}}" placeholder="Enter Batch" class="form-control mb-3"><br>
            <input type="text" place="place" value="{{student.place}}" placeholder="Enter place" class="form-control mb-3">
            <div class="d-flex justify-content-between">
                <button class="btn btn-success">Submit</button>
                <a href="{% url 'slist'%}" class="btn btn-danger">Update</a>
            </div>
        </form>
    </div>

    <footer class="bg-info text-light text-center p-2 fixed-bottom">
        <h6>Student management app @ 2026</h6>

       </footer>
        
   
    </body>
</html>
